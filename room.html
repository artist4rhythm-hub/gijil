<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>빚으신 나 모임방</title>
<meta name="theme-color" content="#F3F3F0">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: index.html과 같은 화이트 큐브 + 기질 색면. 모임 진행용 한 화면 앱 */
:root{
  --wall:#F3F3F0; --frame:#FFFFFF; --ink:#1C1F22; --muted:#5E6368; --line:#E2E2DE;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 14px 30px -20px rgba(0,0,0,.35);
  --s:#C9581E; --c:#A82A35; --m:#2A5592; --p:#3F7F67; --ok:#2D6B54; --ok-soft:#E5F1EC;
  --s-soft:#FBEDE4; --c-soft:#F8E6E7; --m-soft:#E6EDF7; --p-soft:#E5F1EC;
  --on-band:#FFFFFF; --focus:#2A5592;
  --display:"Gowun Batang","Nanum Myeongjo","Noto Serif CJK KR",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --wall:#141618; --frame:#1E2124; --ink:#ECEDEE; --muted:#A3A9AE; --line:#30353A;
  --shadow:0 0 0 1px #2A2E32,0 14px 30px -20px rgba(0,0,0,.8);
  --s:#B9541F; --c:#A0333D; --m:#2F5A97; --p:#3B765F; --ok:#74B89D; --ok-soft:#1B2D26;
  --s-soft:#33241B; --c-soft:#34201F; --m-soft:#1C2635; --p-soft:#1B2D26; --focus:#7AA3DD; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;margin:0;padding-block:env(safe-area-inset-top,0px) 56px}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.3;margin:0;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.view{display:flex;flex-direction:column;gap:18px;padding-top:22px}
.top{display:flex;justify-content:space-between;align-items:center;padding-block:12px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted);font-weight:600}
.top a{text-decoration:none}
.eyebrow{font-size:12.5px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 22px;font-weight:700;background:var(--ink);color:var(--wall);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.red{background:var(--c);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:16px}
.frame{background:var(--frame);box-shadow:var(--shadow)}
.card{padding:18px;display:flex;flex-direction:column;gap:10px}
.note{font-size:14px;color:var(--muted)}
.err{font-size:14px;color:var(--c);font-weight:600}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input[type=text],input[type=tel]{font:inherit;color:var(--ink);background:var(--frame);border:1.5px solid var(--line);border-radius:10px;padding:12px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;border:0;padding:10px 0;border-radius:10px;background:var(--frame);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--wall);box-shadow:none}
/* 문 */
.door{position:relative;height:220px;background:#191b1e;display:flex;justify-content:center;align-items:flex-end;overflow:hidden;border-radius:4px}
.door .lt{position:absolute;inset:0;background:radial-gradient(ellipse 45% 75% at 50% 100%,rgba(255,226,170,.55),transparent 70%);opacity:0;animation:light 1.4s .5s forwards}
.door .fr{width:140px;height:180px;border:6px solid #3a3d42;border-bottom:0;position:relative;background:linear-gradient(180deg,#fff2d8,#ffd9a0);perspective:400px}
.door .lf,.door .rf{position:absolute;top:0;bottom:0;width:50%;background:#5a4632;box-shadow:inset 0 0 0 3px #4a3828}
.door .lf{left:0;transform-origin:left;animation:openL 1.4s .3s forwards}
.door .rf{right:0;transform-origin:right;animation:openR 1.4s .3s forwards}
.door.still .lf{transform:rotateY(62deg);animation:none}.door.still .rf{transform:rotateY(-62deg);animation:none}.door.still .lt{opacity:1;animation:none}
@keyframes openL{to{transform:rotateY(62deg)}} @keyframes openR{to{transform:rotateY(-62deg)}} @keyframes light{to{opacity:1}}
.code{font-family:var(--display);font-size:38px;letter-spacing:.06em;text-align:center;line-height:1.1}
.qr{display:flex;justify-content:center}
.qr img,.qr svg{width:170px;height:170px;background:#fff;padding:8px;border-radius:4px}
/* 진행 */
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.mlist{display:flex;flex-direction:column;gap:6px}
.mi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 12px;font-size:15px}
.mi small{color:var(--muted);font-size:12.5px;margin-left:6px}
.pill{font-size:12.5px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.ing{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
/* 문항 */
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qtitle{font-size:clamp(21px,5.6vw,26px)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--frame);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;font-size:17px;line-height:1.45}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* 봉인 */
.seal{margin:16px auto 0;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d24b4b,#8f1f25 70%);display:grid;place-items:center;box-shadow:0 20px 40px -18px rgba(0,0,0,.6),inset 0 -8px 18px rgba(0,0,0,.25);animation:breathe 3s ease-in-out infinite}
.seal span{font-family:var(--display);color:#ffe9e3;font-size:22px;text-align:center;line-height:1.3}
@keyframes breathe{50%{transform:scale(1.03)}}
.seal.break{animation:crack .9s forwards}
@keyframes crack{30%{transform:scale(1.12) rotate(-4deg)}100%{transform:scale(.2) rotate(30deg);opacity:0}}
/* 결과 색면 */
.band{color:var(--on-band);border-radius:2px}
.band .in{padding:26px 20px 24px;display:flex;flex-direction:column;gap:6px}
.band .k{font-size:12.5px;letter-spacing:.12em;font-weight:600;opacity:.92}
.band h1{font-size:clamp(40px,12vw,58px);line-height:1.05}
.band .nick{font-size:15px;opacity:.92}
.reveal-in{animation:rise .8s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:13.5px;padding:5px 11px;background:var(--frame);box-shadow:var(--shadow)}
/* 지도 */
.mapbox{background:var(--frame);border:1px solid var(--line);border-radius:14px;padding:8px}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox a{cursor:pointer}
.groups{display:grid;gap:8px}
.grp{padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.grp b{font-family:var(--display);font-size:18px}
.sw{width:30px;height:30px;border-radius:4px;flex:none}
.confirm{padding:14px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--c);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--wall);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.big-map{position:fixed;inset:0;background:var(--wall);z-index:30;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px 16px}
.big-map .mapbox{flex:1;display:flex;align-items:center;justify-content:center}
.big-map svg{max-height:100%;width:auto;max-width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><a href="index.html">빚으신 나</a><span id="topRight">모임방</span></div></div>

<main id="v-loading"><div class="wrap view"><p class="note">불러오는 중…</p></div></main>

<!-- 첫 화면: 코드로 입장 / 운영자 로그인 -->
<main id="v-start" hidden><div class="wrap view">
  <p class="eyebrow">모임방</p>
  <h1 style="font-size:32px">셀리더가 알려 준<br>입장 코드를 넣어 주세요</h1>
  <label class="field" for="codeInput">입장 코드 (숫자 4자리)
    <input type="tel" id="codeInput" inputmode="numeric" maxlength="4" placeholder="예: 4827" autocomplete="off">
  </label>
  <p class="err" id="codeErr" hidden></p>
  <button class="btn block" id="codeBtn" type="button">입장하기</button>
  <div class="frame card" style="margin-top:20px">
    <p style="font-weight:700">셀리더이신가요?</p>
    <p class="note">구글 계정으로 로그인하면 모임방을 열고 진행할 수 있습니다.</p>
    <button class="btn ghost" id="loginBtn" type="button">구글로 로그인</button>
    <p class="err" id="loginErr" hidden></p>
  </div>
</div></main>

<!-- 운영자: 내 방 목록 -->
<main id="v-home" hidden><div class="wrap view">
  <p class="eyebrow">운영자 · <span id="adminEmail"></span></p>
  <h1 style="font-size:30px">모임방</h1>
  <div class="frame card">
    <label class="field" for="titleInput">새 방 이름
      <input type="text" id="titleInput" maxlength="40">
    </label>
    <button class="btn" id="openBtn" type="button">모임방 열기</button>
    <p class="err" id="openErr" hidden></p>
  </div>
  <p style="font-weight:700;margin-top:6px">지난 방</p>
  <div class="mlist" id="roomList"></div>
  <button class="btn ghost small" id="logoutBtn" type="button" style="align-self:flex-start">로그아웃</button>
</div></main>

<!-- 운영자: 방 진행 -->
<main id="v-admin" hidden><div class="wrap view" id="adminBox"></div></main>

<!-- 참석자: 입장 정보 -->
<main id="v-profile" hidden><div class="wrap view">
  <p class="eyebrow" id="pfRoom"></p>
  <h1 style="font-size:30px">하나님이 빚으신 나,<br>어떤 기질일까?</h1>
  <label class="field" for="nameInput">이름
    <input type="text" id="nameInput" maxlength="12" placeholder="예: 김요한" autocomplete="off">
  </label>
  <div class="field"><span>연령대 (선택)</span><div class="seg" id="ageSeg" role="group" aria-label="연령대"></div></div>
  <div class="field"><span>성별 (선택)</span><div class="seg" id="genSeg" role="group" aria-label="성별"></div></div>
  <p class="note">결과는 이 방에 함께 있는 사람들과 셀리더만 봅니다. 생년월일이나 연락처는 받지 않습니다.</p>
  <p class="err" id="pfErr" hidden></p>
  <button class="btn block" id="joinBtn" type="button">검사 시작하기 (24문항)</button>
</div></main>

<!-- 참석자: 검사 -->
<main id="v-quiz" hidden><div class="wrap view">
  <div class="progress" aria-hidden="true"><i id="prog"></i></div>
  <div class="qmeta"><span id="qPart"></span><span id="qNum"></span></div>
  <h2 class="qtitle" id="qTitle"></h2>
  <p class="note" id="qHint"></p>
  <div class="opts" id="opts" role="group" aria-labelledby="qTitle"></div>
  <div class="row"><button class="btn ghost small" id="backBtn" type="button">이전 문항</button></div>
</div></main>

<!-- 참석자: 봉인 -->
<main id="v-sealed" hidden><div class="wrap view" style="text-align:center;align-items:center">
  <div class="seal" id="seal"><span>당신의<br>기질</span></div>
  <h2 style="font-size:26px;margin-top:10px">결과가 봉인되었습니다</h2>
  <p class="note" style="font-size:15px">셀리더가 공개하면 모두 함께 열립니다.<br>그동안 네 기질 설명을 들으며<br>내 기질을 짐작해 보세요.</p>
  <a class="btn ghost block" href="index.html#types" target="_blank" rel="noopener" style="margin-top:12px">기질 전시관 둘러보기</a>
</div></main>

<!-- 참석자: 결과 + 지도 -->
<main id="v-result" hidden><div class="wrap view" id="resultBox"></div></main>

<!-- 닫힌 방 / 오류 -->
<main id="v-msg" hidden><div class="wrap view"><h2 id="msgTitle" style="font-size:26px"></h2><p class="note" id="msgBody"></p><a class="btn ghost" href="room.html">처음으로</a></div></main>

<div class="toast" id="toast" hidden role="status"></div>
<div class="big-map" id="bigMap" hidden><div class="row" style="justify-content:space-between"><h2 id="bigTitle" style="font-size:24px"></h2><button class="btn small" id="bigClose" type="button">닫기</button></div><div class="mapbox"><svg id="bigSvg" viewBox="0 0 400 400" role="img" aria-label="우리 셀 기질 지도"></svg></div></div>

<script src="qrcode.js"></script>
<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInAnonymously, signInWithPopup, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, connectAuthEmulator, signInWithCredential } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

function shuffled(i){const a=[...K];let s=(i+3)*2654435761>>>0;for(let j=a.length-1;j>0;j--){s=(s*1103515245+12345)>>>0;const r=s%(j+1);[a[j],a[r]]=[a[r],a[j]]}return a}
function score(ans){
  const tot={S:0,C:0,M:0,P:0}, sit={S:0,C:0,M:0,P:0};
  ans.forEach((k,i)=>{ if(!k) return; tot[k]++; if(D.Q[i].part===3) sit[k]++; });
  const n=ans.filter(Boolean).length||1, pct={}; K.forEach(k=>pct[k]=Math.round(tot[k]/n*100));
  const rank=[...K].sort((a,b)=>tot[b]-tot[a]||sit[b]-sit[a]||K.indexOf(a)-K.indexOf(b));
  return {code:rank[0]+rank[1], pct};
}

/* ---------- 지도 SVG ---------- */
function mapSVG(people, big){
  const W=400,pad=36,half=(W-pad*2)/2,cx=W/2,cy=W/2,fs=big?1.2:1;
  const q=[["S",pad,pad,"다혈질","외향 · 사람"],["C",cx,pad,"담즙질","외향 · 일"],["P",pad,cy,"점액질","내향 · 사람"],["M",cx,cy,"우울질","내향 · 일"]];
  let h=`<rect width="${W}" height="${W}" fill="var(--frame)"/>`;
  q.forEach(([k,x,y,n,sub])=>{const L=k==="S"||k==="P",T=k==="S"||k==="C";
    h+=`<rect x="${x}" y="${y}" width="${half}" height="${half}" fill="${SOFT[k]}"/><text x="${L?x+10:x+half-10}" y="${T?y+24:y+half-26}" text-anchor="${L?"start":"end"}" font-size="17" font-weight="700" fill="${COLOR[k]}" font-family="Gowun Batang,serif">${n}</text><text x="${L?x+10:x+half-10}" y="${T?y+40:y+half-10}" text-anchor="${L?"start":"end"}" font-size="12" fill="var(--muted)">${sub}</text>`});
  h+=`<line x1="${cx}" y1="${pad}" x2="${cx}" y2="${W-pad}" stroke="var(--line)"/><line x1="${pad}" y1="${cy}" x2="${W-pad}" y2="${cy}" stroke="var(--line)"/>`;
  h+=`<text x="${cx}" y="22" text-anchor="middle" font-size="12" fill="var(--muted)">외향</text><text x="${cx}" y="${W-12}" text-anchor="middle" font-size="12" fill="var(--muted)">내향</text>`;
  const placed=[];
  people.forEach(m=>{const p=m.pct,x0=(p.C+p.M-p.S-p.P)/100,y0=(p.S+p.C-p.M-p.P)/100;
    let x=cx+x0*half*.92,y=cy-y0*half*.92; placed.forEach(o=>{if(Math.hypot(o[0]-x,o[1]-y)<24)y+=24});
    x=Math.max(pad+8,Math.min(W-pad-8,x)); y=Math.max(pad+8,Math.min(W-pad-8,y)); placed.push([x,y]);
    const right=x<cx+half*.4;
    h+=`<a href="index.html#blend-${m.code.toLowerCase()}" target="_blank"><circle cx="${x}" cy="${y}" r="${7*fs}" fill="${COLOR[m.code[0]]}" stroke="var(--frame)" stroke-width="2"/><text x="${right?x+11:x-11}" y="${y+5}" text-anchor="${right?"start":"end"}" font-size="${14.5*fs}" font-weight="600" fill="var(--ink)">${esc(m.name)}${m.me?" (나)":""}</text></a>`});
  return h;
}

    const ST={open:"진행 중",revealed:"결과 공개됨",closed:"닫힘"};
    $("#roomList").innerHTML=rows.length?rows.map(r=>`<a class="mi frame" style="text-decoration:none" href="?r=${r.id}"><span>${esc(r.title)}<small>코드 ${esc(r.code)}</small></span><span class="pill ${r.status==="closed"?"ing":"done"}">${ST[r.status]||""}</span></a>`).join(""):`<p class="note">아직 연 방이 없습니다.</p>`;
  }catch(e){ $("#roomList").innerHTML=`<p class="err">방 목록을 불러오지 못했습니다. 보안 규칙의 운영자 이메일을 확인해 주세요.</p>`; }
}
$("#openBtn").addEventListener("click", async ()=>{
  const title=$("#titleInput").value.trim(); $("#openErr").hidden=true;
  if(!title){ $("#openErr").textContent="방 이름을 넣어 주세요."; $("#openErr").hidden=false; return; }
  $("#openBtn").disabled=true;
  try{
    let num=null;
    for(let i=0;i<8;i++){ const c=String(1000+Math.floor(Math.random()*9000)); const s=await getDoc(doc(db,"codes",c)); if(!s.exists()){num=c;break;} }
    if(!num) throw new Error("code");
    const word=CODE_WORDS[Math.floor(Math.random()*CODE_WORDS.length)];
    const ref=doc(collection(db,"rooms"));
    const b=writeBatch(db);
    b.set(ref,{ownerUid:me.uid,status:"open",kind:"cell",title,code:`${word} ${num}`,createdAt:serverTimestamp()});
    b.set(doc(db,"codes",num),{roomId:ref.id,ownerUid:me.uid,createdAt:serverTimestamp()});
    await b.commit();
    location.href=`?r=${ref.id}&new=1`;
  }catch(e){ $("#openBtn").disabled=false; $("#openErr").textContent="방을 열지 못했습니다. 이 계정이 보안 규칙의 운영자 목록에 있는지 확인해 주세요."; $("#openErr").hidden=false; }
});

/* ---------- 운영자: 방 진행 ---------- */
let A = {members:[], results:{}, preview:false, confirm:null};
function adminRoom(){
  stopAll(); show("admin"); $("#topRight").textContent="운영자";
  unsub.push(onSnapshot(doc(db,"rooms",roomId), s=>{ if(!s.exists()){ msg("방이 없습니다","지워졌거나 잘못된 링크입니다."); return; } room={id:s.id,...s.data()}; renderAdmin(); }, ()=>msg("방을 열 수 없습니다","권한이 없거나 방이 지워졌습니다.")));
  unsub.push(onSnapshot(collection(db,"rooms",roomId,"members"), s=>{ A.members=s.docs.map(x=>({uid:x.id,...x.data()})).sort((a,b)=>(a.joinedAt?.seconds||0)-(b.joinedAt?.seconds||0)); renderAdmin(); }, ()=>{}));
  unsub.push(onSnapshot(collection(db,"rooms",roomId,"results"), s=>{ A.results={}; s.docs.forEach(x=>A.results[x.id]=x.data()); renderAdmin(); }, ()=>{}));
}
function renderAdmin(){
  if(!room) return;
  const ms=A.members, done=ms.filter(m=>m.done).length, st=room.status;
  const num=room.code.split(" ")[1]||room.code;
  const people=ms.filter(m=>A.results[m.uid]).map(m=>({name:m.name,code:A.results[m.uid].code,pct:A.results[m.uid].pct}));
  const groups={}; people.forEach(p=>{(groups[p.code]=groups[p.code]||[]).push(p.name)});
  const showCodes = st!=="open" || A.preview;
  const fresh = params.get("new")==="1" && !renderAdmin._done; renderAdmin._done=true;
  const stepTxt={open:"입장과 검사가 진행 중입니다",revealed:"결과가 공개되었습니다",closed:"방이 닫혔습니다"}[st];
  $("#adminBox").innerHTML=`
    ${st==="open"?`<div class="door ${fresh?"":"still"}"><div class="lt"></div><div class="fr"><div class="lf"></div><div class="rf"></div></div></div>`:""}
    <div style="text-align:center" class="stack"><p class="eyebrow">${esc(stepTxt)}</p><h1 style="font-size:28px">${esc(room.title)}</h1></div>
    ${st!=="closed"?`<div class="frame card" style="align-items:center;text-align:center">
      <div class="qr" id="qrBox"></div>
      <p class="note">입장 코드</p><p class="code">${esc(room.code)}</p>
      <div class="row" style="justify-content:center"><button class="btn small" id="shareBtn" type="button">입장 링크 보내기</button><button class="btn small ghost" id="copyBtn" type="button">링크 복사</button></div>
      <p class="note" style="word-break:break-all;font-size:12.5px">${esc(link(room.id))}</p>
    </div>`:""}
    <div class="row" style="justify-content:space-between"><h2 style="font-size:22px">${ms.length}명 중 ${done}명 완료</h2>${st==="open"?`<button class="btn small ghost" id="previewBtn" type="button">${A.preview?"결과 숨기기":"결과 미리 보기 (운영자만)"}</button>`:""}</div>
    <div class="progress"><i style="width:${ms.length?done/ms.length*100:0}%"></i></div>
    <div class="mlist">${ms.length?ms.map(m=>{const r=A.results[m.uid];return `<div class="mi frame"><span>${esc(m.name)}<small>${esc([m.age,m.gender].filter(Boolean).join(" · "))}</small></span>${m.done?(showCodes&&r?`<span class="pill done"><span class="dot" style="background:${COLOR[r.code[0]]}"></span>${D.BL[r.code].name}</span>`:`<span class="pill done">완료</span>`):`<span class="pill ing">검사 중 ${m.progress||0}/24</span>`}</div>`}).join(""):`<p class="note">아직 입장한 사람이 없습니다. 링크나 코드를 알려 주세요.</p>`}</div>
    ${st==="open"?`
      ${A.confirm==="reveal"?`<div class="confirm"><p style="font-weight:700">결과를 공개할까요?</p><p class="note">${ms.length-done>0?`아직 검사 중인 사람이 ${ms.length-done}명 있습니다. 공개 후에도 끝나는 대로 바로 보입니다.`:"모두 검사를 마쳤습니다."} 공개하면 되돌릴 수 없습니다.</p><div class="row"><button class="btn red" id="revealYes" type="button">공개하기</button><button class="btn ghost" id="cancelBtn" type="button">취소</button></div></div>`
      :`<button class="btn red block" id="revealBtn" type="button" ${done?"":"disabled"}>결과 공개하기</button>`}`:""}
    ${showCodes&&people.length?`<section class="stack" style="gap:10px"><h2 style="font-size:22px;margin-top:8px">기질 카드 나눠 주기</h2>
      <div class="groups">${Object.keys(groups).sort().map(c=>`<div class="grp frame"><span class="sw" style="background:linear-gradient(0deg,${COLOR[c[1]]} 0 30%,${COLOR[c[0]]} 30%)"></span><div><b>${D.BL[c].name}</b><p class="note">${groups[c].map(esc).join(", ")}</p></div><span class="pill ing">${groups[c].length}장</span></div>`).join("")}</div></section>`:""}
    ${st!=="open"&&people.length?`<section class="stack" style="gap:10px"><div class="row" style="justify-content:space-between"><h2 style="font-size:22px">우리 셀 기질 지도</h2><button class="btn small" id="bigBtn" type="button">크게 보기</button></div><div class="mapbox"><svg viewBox="0 0 400 400" role="img" aria-label="우리 셀 기질 지도">${mapSVG(people)}</svg></div></section>`:""}
    <div class="stack" style="gap:8px;margin-top:10px">
      ${st==="revealed"?(A.confirm==="close"?`<div class="confirm"><p style="font-weight:700">방을 닫을까요?</p><p class="note">닫으면 새로 들어올 수 없습니다. 이미 있는 사람은 결과와 지도를 계속 볼 수 있습니다.</p><div class="row"><button class="btn red" id="closeYes" type="button">닫기</button><button class="btn ghost" id="cancelBtn" type="button">취소</button></div></div>`:`<button class="btn ghost" id="closeBtn" type="button">방 닫기 (새 입장 막기)</button>`):""}
      ${A.confirm==="delete"?`<div class="confirm"><p style="font-weight:700">방과 모든 결과를 지울까요?</p><p class="note">참석자 ${ms.length}명의 정보와 결과가 모두 지워지고 되돌릴 수 없습니다.</p><div class="row"><button class="btn red" id="delYes" type="button">모두 지우기</button><button class="btn ghost" id="cancelBtn" type="button">취소</button></div></div>`:`<button class="btn ghost small" id="delBtn" type="button" style="align-self:flex-start">방 지우기</button>`}
      <a class="btn ghost small" href="room.html" style="align-self:flex-start">← 방 목록</a>
    </div>`;
  const qb=$("#qrBox"); if(qb&&window.qrcode){ const qr=qrcode(0,"M"); qr.addData(link(room.id)); qr.make(); qb.innerHTML=qr.createSvgTag({cellSize:4,margin:2,scalable:true}); }
  const on=(id,fn)=>{const e=$("#"+id); if(e) e.addEventListener("click",fn);};
  on("copyBtn",()=>copy(link(room.id)));
  on("shareBtn",async()=>{const text=`[빚으신 나] ${room.title} 모임방입니다. 링크를 눌러 들어오세요. (입장 코드 ${num})`; if(navigator.share){try{await navigator.share({title:"빚으신 나 모임방",text,url:link(room.id)})}catch(e){}} else copy(text+"\n"+link(room.id));});
  on("previewBtn",()=>{A.preview=!A.preview;renderAdmin();});
  on("revealBtn",()=>{A.confirm="reveal";renderAdmin();});
  on("closeBtn",()=>{A.confirm="close";renderAdmin();});
  on("delBtn",()=>{A.confirm="delete";renderAdmin();});
  on("cancelBtn",()=>{A.confirm=null;renderAdmin();});
  on("revealYes",async()=>{A.confirm=null;try{await updateDoc(doc(db,"rooms",roomId),{status:"revealed",revealedAt:serverTimestamp()});toast("결과를 공개했습니다");}catch(e){toast("공개하지 못했습니다. 다시 눌러 주세요");}});
  on("closeYes",async()=>{A.confirm=null;try{await updateDoc(doc(db,"rooms",roomId),{status:"closed",closedAt:serverTimestamp()});toast("방을 닫았습니다");}catch(e){toast("닫지 못했습니다");}});
  on("delYes",deleteRoom);
  on("bigBtn",()=>openBig(room.title,people));
}
async function deleteRoom(){
  try{
    stopAll();
    const ms=await getDocs(collection(db,"rooms",roomId,"members")), rs=await getDocs(collection(db,"rooms",roomId,"results"));
    const b=writeBatch(db);
    rs.docs.forEach(d=>b.delete(d.ref)); ms.docs.forEach(d=>b.delete(d.ref));
    const num=(room.code.split(" ")[1]||"");
    if(num) b.delete(doc(db,"codes",num));
    b.delete(doc(db,"rooms",roomId));
    await b.commit();
    location.href="room.html";
  }catch(e){ toast("지우지 못했습니다. 다시 시도해 주세요"); adminRoom(); }
}
function copy(text){ try{ navigator.clipboard.writeText(text).then(()=>toast("복사했습니다"),()=>toast("복사하지 못했습니다. 길게 눌러 복사해 주세요")); }catch(e){ toast("복사하지 못했습니다"); } }

/* ---------- 참석자 ---------- */
const AKEY=()=>"bn_room_"+roomId;
async function participant(){
  stopAll(); $("#topRight").textContent=room.title;
  let mine=null;
  try{ const s=await getDoc(doc(db,"rooms",roomId,"members",me.uid)); if(s.exists()) mine=s.data(); }catch(e){ mine=null; }
  if(!mine){
    if(room.status==="closed"){ msg("이 모임방은 닫혔습니다","새로 들어갈 수 없습니다. 셀리더에게 문의해 주세요."); return; }
    profileView(); return;
  }
  if(!mine.done){ const sv=store.get(AKEY(),null); answers=sv&&sv.length===24?sv:new Array(24).fill(null); idx=Math.max(0,answers.findIndex(a=>!a)); if(idx<0) idx=23; show("quiz"); renderQ(); return; }
  waitOrReveal(false);
}
function profileView(){
  show("profile"); $("#pfRoom").textContent=room.title;
  const seg=(el,list,key)=>{ el.innerHTML=list.map(v=>`<button type="button" aria-pressed="${profile[key]===v}">${v}</button>`).join(""); el.querySelectorAll("button").forEach((b,i)=>b.addEventListener("click",()=>{profile[key]=profile[key]===list[i]?"":list[i]; seg(el,list,key);})); };
  seg($("#ageSeg"),AGES,"age"); seg($("#genSeg"),GENS,"gender");
}
$("#joinBtn").addEventListener("click", async ()=>{
  const name=$("#nameInput").value.trim(); $("#pfErr").hidden=true;
  if(!name){ $("#pfErr").textContent="이름을 넣어 주세요."; $("#pfErr").hidden=false; return; }
  $("#joinBtn").disabled=true;
  try{
    await setDoc(doc(db,"rooms",roomId,"members",me.uid),{name,age:profile.age,gender:profile.gender,progress:0,done:false,joinedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    answers=new Array(24).fill(null); idx=0; store.set(AKEY(),answers); show("quiz"); renderQ();
  }catch(e){ $("#joinBtn").disabled=false; $("#pfErr").textContent="들어가지 못했습니다. 방이 닫혔을 수 있습니다."; $("#pfErr").hidden=false; }
});
let lastSent=0;
function renderQ(){
  const q=D.Q[idx];
  $("#prog").style.width=(idx/24*100)+"%";
  $("#qPart").textContent=PART_LABEL[q.part]; $("#qNum").textContent=(idx+1)+" / 24";
  $("#qTitle").textContent=q.t; $("#qHint").textContent=PART_HINT[q.part];
  const box=$("#opts"); box.innerHTML="";
  shuffled(idx).forEach(k=>{
    const b=document.createElement("button"); b.type="button"; b.className="opt"; b.textContent=q.o[k];
    b.setAttribute("aria-pressed",answers[idx]===k?"true":"false");
    b.addEventListener("click",()=>{ answers[idx]=k; store.set(AKEY(),answers); b.setAttribute("aria-pressed","true");
      const n=answers.filter(Boolean).length;
      if(n-lastSent>=3 && n<24){ lastSent=n; updateDoc(doc(db,"rooms",roomId,"members",me.uid),{progress:n,updatedAt:serverTimestamp()}).catch(()=>{}); }
      setTimeout(()=>{ if(idx<23){idx++;renderQ()} else finish(); },160); });
    box.appendChild(b);
  });
  $("#backBtn").style.visibility=idx===0?"hidden":"visible";
}
$("#backBtn").addEventListener("click",()=>{ if(idx>0){idx--;renderQ()} });
async function finish(){
  if(answers.some(a=>!a)){ idx=answers.findIndex(a=>!a); renderQ(); toast("빠진 문항이 있습니다"); return; }
  const r=score(answers);
  try{
    await setDoc(doc(db,"rooms",roomId,"results",me.uid),{code:r.code,pct:r.pct,createdAt:serverTimestamp()});
  }catch(e){ /* 이미 냈으면 그대로 진행 */ }
  try{ await updateDoc(doc(db,"rooms",roomId,"members",me.uid),{progress:24,done:true,updatedAt:serverTimestamp()}); }catch(e){}
  store.del(AKEY());
  waitOrReveal(true);
}
function waitOrReveal(justFinished){
  unsub.push(onSnapshot(doc(db,"rooms",roomId), async s=>{
    if(!s.exists()){ msg("방이 지워졌습니다","셀리더가 방을 정리했습니다."); return; }
    room={id:s.id,...s.data()};
    if(room.status==="open"){ show("sealed"); return; }
    if(!$("#v-sealed").hidden){ const sl=$("#seal"); sl.classList.add("break"); await new Promise(r=>setTimeout(r,850)); sl.classList.remove("break"); }
    showResult();
  }, ()=>{}));
}
let resultShown=false;
async function showResult(){
  if(resultShown) return; resultShown=true;
  let mine;
  try{ const s=await getDoc(doc(db,"rooms",roomId,"results",me.uid)); mine=s.data(); }catch(e){ resultShown=false; toast("결과를 불러오지 못했습니다"); return; }
  const b=D.BL[mine.code], p=mine.code[0], q=mine.code[1];
  show("result");
  $("#resultBox").innerHTML=`
    <section class="band reveal-in" style="background:linear-gradient(0deg,${COLOR[q]} 0 14px,${COLOR[p]} 14px)"><div class="in">
      <span class="k">봉인이 열렸습니다 · 주 ${NAME[p]} + 보조 ${NAME[q]}</span><h1>${b.name}</h1><span class="nick">${esc(b.tagline)} · 성경 인물 ${esc(b.bible)}</span></div></section>
    <p style="font-size:15.5px">셀리더에게 <b>${b.name} 카드</b>를 받아 주세요. 카드 뒷면 QR로 언제든 이 내용을 다시 볼 수 있습니다.</p>
    <div class="chips">${b.st.map(x=>`<span>강점 · ${esc(x)}</span>`).join("")}${b.wk.map(x=>`<span>약점 · ${esc(x)}</span>`).join("")}</div>
    <a class="btn ghost block" href="index.html#blend-${mine.code.toLowerCase()}" target="_blank" rel="noopener">내 조합 전시실 자세히 보기</a>
    <section class="stack" style="gap:10px;margin-top:6px"><div class="row" style="justify-content:space-between"><h2 style="font-size:22px">우리 셀 기질 지도</h2><button class="btn small" id="pBig" type="button">크게 보기</button></div>
      <div class="mapbox"><svg viewBox="0 0 400 400" id="pMap" role="img" aria-label="우리 셀 기질 지도"></svg></div>
      <p class="note">이름을 누르면 그 형제의 조합 전시실이 열립니다.</p><div class="groups" id="pGroups"></div></section>`;
  let ms=[], rs={};
  const draw=()=>{ const people=ms.filter(m=>rs[m.uid]).map(m=>({name:m.name,code:rs[m.uid].code,pct:rs[m.uid].pct,me:m.uid===me.uid}));
    $("#pMap").innerHTML=mapSVG(people);
    const g={}; people.forEach(x=>{(g[x.code]=g[x.code]||[]).push(x.name)});
    $("#pGroups").innerHTML=Object.keys(g).sort().map(c=>`<a class="grp frame" style="text-decoration:none" href="index.html#blend-${c.toLowerCase()}" target="_blank"><span class="sw" style="background:linear-gradient(0deg,${COLOR[c[1]]} 0 30%,${COLOR[c[0]]} 30%)"></span><div><b>${D.BL[c].name}</b><p class="note">${g[c].map(esc).join(", ")}</p></div><span class="note">›</span></a>`).join("");
    const pb=$("#pBig"); if(pb) pb.onclick=()=>openBig(room.title,people); };
  unsub.push(onSnapshot(collection(db,"rooms",roomId,"members"),s=>{ms=s.docs.map(x=>({uid:x.id,...x.data()}));draw();},()=>{}));
  unsub.push(onSnapshot(collection(db,"rooms",roomId,"results"),s=>{rs={};s.docs.forEach(x=>rs[x.id]=x.data());draw();},()=>{}));
}

/* ---------- 시작 ---------- */
getRedirectResult(auth).catch(()=>{});
let booted=false;
onAuthStateChanged(auth, async u=>{
  me=u;
  if(!roomId){
    if(isAdminUser(u)){ adminHome(); } else { show("start"); }
    return;
  }
  if(!u){ try{ await signInAnonymously(auth); }catch(e){ msg("연결할 수 없습니다","인터넷 연결을 확인하고 다시 열어 주세요."); } return; }
  if(booted) return; booted=true;
  try{
    const s=await getDoc(doc(db,"rooms",roomId));
    if(!s.exists()){ msg("방을 찾을 수 없습니다","링크가 잘못되었거나 방이 지워졌습니다."); return; }
    room={id:s.id,...s.data()};
    if(!u.isAnonymous && room.ownerUid===u.uid) adminRoom(); else participant();
  }catch(e){ msg("방을 열 수 없습니다","인터넷 연결을 확인하고 다시 열어 주세요."); }
});
</script>
